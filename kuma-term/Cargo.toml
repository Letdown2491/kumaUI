[package]
name = "kuma-term"
version = "0.2.0"
edition = "2024"
description = "Terminal emulator spike: alacritty_terminal behind an engine seam, gpui renderer"
license = "MIT"
repository = "https://github.com/Letdown2491/kumaUI"

[dev-dependencies]
# view-level tests drive the real gpui event loop
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true }

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
alacritty_terminal = "0.26"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
libc = "0.2"
rustc-hash = "1.1"
