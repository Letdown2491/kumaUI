[package]
name = "kuma-monitor"
version = "0.4.0"
edition = "2024"
description = "Window-aware process monitor spike: observation only (issue #71)"
license = "MIT"
repository = "https://github.com/Letdown2491/kumaUI"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
kuma-platform = { workspace = true }
dirs = "7"
sysinfo = "0.33"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# view-level tests drive the real gpui event loop
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true }
