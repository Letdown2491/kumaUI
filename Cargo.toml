[workspace]
members = ["kuma-files", "kuma-shell"]
exclude = ["vendor"]
resolver = "2"

[workspace.dependencies]
gpui = { path = "vendor/zed/crates/gpui" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["wayland"] }
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }

# Mirrors the subset of vendor/zed's [patch.crates-io] that intersects gpui's
# dependency graph; zed's patch table does not apply outside their workspace.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }
