[package]
name = "kuma-files"
version = "0.4.1"
edition = "2024"
description = "Koguma, kumaOS's file manager (starts as the gpui DnD spike for issue #25)"
license = "MIT"
repository = "https://github.com/Letdown2491/kumaUI"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
kuma-platform = { workspace = true }
log = "0.4"
env_logger = "0.11"
trash = "5"
dirs = "7"
image = "0.25"
smallvec = "1"
anyhow = "1"
notify = "8"
nucleo = "0.5"
futures = "0.3"
pulldown-cmark = "0.13"
libc = "0.2"
# epub glances: container reads plus the two small XML docs
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
# svg previews: in-process rasterization through the resvg gpui
# already links (no new binary weight; same feature set as the
# vendored gpui's, so the unified build adds no code either).
# A DynamicImage out keeps the thumb pipeline, disk cache, and
# viewer rotation uniform with the other decodable kinds.
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts"] }
# video: in-process libav decode (kumaOS ships ffmpeg-libs, no CLI;
# headers are the free build's, same sonames as the runtime libs).
# The sys crate, not ffmpeg-next: the safe wrapper's 9.0.0 release
# calls avcodec_close, removed in FFmpeg 8, behind an undeclared
# feature, so it cannot link against the 8.1 libs the image ships.
# Optional by the portability rule: libav is a capability, not a
# requirement; a system without a matching libav builds with
# --no-default-features and video degrades to the type icon
# swresample: the player's audio path converts decoder output
# (usually planar float) to the sink's S16NE stereo
ffmpeg-sys-next = { version = "9", optional = true, default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }

[features]
# video: in-process libav decode, default on. Off, the app builds
# and runs anywhere; videos show the type icon and the plain card
default = ["video"]
video = ["dep:ffmpeg-sys-next"]

[dev-dependencies]
# only test builds pull this in; the release binary stays lean
gpui = { workspace = true, features = ["test-support"] }
# real font shaping so text-driven hitboxes have real bounds in tests
gpui_wgpu = { workspace = true }
