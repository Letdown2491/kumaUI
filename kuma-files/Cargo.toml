[package]
name = "kuma-files"
version = "0.1.0"
edition = "2024"
description = "Koguma, kumaOS's file manager (starts as the gpui DnD spike for issue #25)"
license = "MIT"
repository = "https://github.com/Letdown2491/kumaUI"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
log = "0.4"
env_logger = "0.11"
trash = "5"
dirs = "7"
image = "0.25"
smallvec = "1"
anyhow = "1"
notify = "8"
nucleo = "0.5"
futures = "0.3"
pulldown-cmark = "0.13"
libc = "0.2"

[dev-dependencies]
# only test builds pull this in; the release binary stays lean
gpui = { workspace = true, features = ["test-support"] }
# real font shaping so text-driven hitboxes have real bounds in tests
gpui_wgpu = { workspace = true }
